name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # fmt · clippy · test (3 OS) · MSRV · cargo-deny · cargo-vet · secret scan ·
  # fuzz build-check · per-line coverage gate.
  #
  # No overrides: MSRV derives from rust-version (1.85) and the root fuzz/ crate
  # is discovered automatically.
  #
  # NOTE — this adopts the fleet coverage SCOPE, which is wider than what this
  # repo measured before. The workflow being replaced ran `cargo llvm-cov --lib`
  # with no features; the fleet default is `--workspace --all-features`. Running
  # the gate locally at the fleet default surfaces 37 uncovered lines in
  # core/src/vfs.rs — the `vfs` feature adapter, which the narrower scope never
  # measured at all. The old job is named "Coverage (100% lines)" and the number
  # was true for what it measured, and silent about a whole feature-gated module.
  #
  # Those 37 lines are left visible on purpose. The two honest ways to clear them
  # are to test the vfs adapter, or to declare the exclusion explicitly with
  # `coverage-ignore-regex: 'core/src/vfs\.rs'` — which is at least reviewable.
  # Narrowing the scope back to --lib would hide the gap again.
  ci:
    uses: SecurityRonin/fleet-config/.github/workflows/rust-ci.yml@c30b7708f0e5900d40c0435eac02a15d0f72df75

  # Repo-specific, so it stays here rather than moving into the shared workflow.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
